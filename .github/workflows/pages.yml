name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      mode: ${{ steps.state.outputs.mode }}
    steps:
      - name: Read or create Pages site
        id: state
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let mode = 'disabled';

            try {
              const { data } = await github.rest.repos.getPages({ owner, repo });
              core.info(`Pages enabled, build_type=${data.build_type}`);
              mode = data.build_type === 'workflow' ? 'actions' : 'branch';
            } catch (error) {
              if (error.status !== 404) {
                core.info(`read Pages failed: HTTP ${error.status}`);
              } else {
                try {
                  const { data } = await github.rest.repos.createPagesSite({ owner, repo, build_type: 'workflow' });
                  core.info(`Pages site created, build_type=${data.build_type}`);
                  mode = 'actions';
                } catch (createError) {
                  core.info(`Pages not enabled, auto-create failed: HTTP ${createError.status}`);
                  core.info('Set Settings -> Pages -> Source to GitHub Actions to enable deployment.');
                }
              }
            }

            core.setOutput('mode', mode);

  deploy:
    needs: detect
    if: needs.detect.outputs.mode == 'actions'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
