<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-label="Liquid Glass Toggle 预览：iOS 26 风格液态玻璃开关">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191d31"/>
      <stop offset="0.55" stop-color="#0b0d16"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.08" r="0.62">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#00c8ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00c8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.62" cy="1.05" r="0.6">
      <stop offset="0" stop-color="#ff4894" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ff4894" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fbd68"/>
      <stop offset="1" stop-color="#178a45"/>
    </linearGradient>
    <linearGradient id="greenSm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fbd68"/>
      <stop offset="1" stop-color="#178a45"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eeeff3"/>
    </linearGradient>
    <linearGradient id="thumbShade" x1="0" y1="0.5" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="trackHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pressFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="softLg" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softSm" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="thumbLg" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1120" height="520" fill="url(#bg)"/>
  <rect width="1120" height="520" fill="url(#glowA)"/>
  <rect width="1120" height="520" fill="url(#glowB)"/>
  <rect width="1120" height="520" fill="url(#glowC)"/>

  <!-- 标题 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">
    <text x="560" y="46" font-size="12" letter-spacing="2.6" fill="#ffffff" fill-opacity="0.36">PURE CSS · ZERO DEPENDENCY</text>
    <text x="560" y="92" font-size="30" font-weight="600" letter-spacing="-0.4" fill="#ffffff" fill-opacity="0.94">Liquid Glass Toggle</text>
    <text x="560" y="118" font-size="13" fill="#ffffff" fill-opacity="0.46">按下时滑块液化：变宽、变矮、玻璃化，轮廓同步贴合轨道内缘</text>
  </g>

  <!-- Hero 大开关 152 × 88，放大 2 倍 -->
  <g transform="translate(408,146)">
    <rect x="0" y="0" width="304" height="176" rx="88" fill="url(#green)" filter="url(#softLg)"/>
    <rect x="1" y="1" width="302" height="174" rx="87" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="0" y="0" width="304" height="176" rx="88" fill="url(#trackHi)"/>
    <rect x="120" y="16" width="176" height="144" rx="72" fill="url(#white)" filter="url(#thumbLg)"/>
    <rect x="120" y="16" width="176" height="144" rx="72" fill="url(#thumbShade)"/>
    <rect x="121" y="17" width="174" height="142" rx="71" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- 三态对比 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">

    <!-- ON -->
    <g transform="translate(262,352) scale(1.5)">
      <rect width="112" height="64" rx="32" fill="url(#greenSm)" filter="url(#softSm)"/>
      <rect x="0.7" y="0.7" width="110.6" height="62.6" rx="31.3" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.4"/>
      <rect width="112" height="64" rx="32" fill="url(#trackHi)"/>
      <rect x="44" y="8" width="64" height="48" rx="24" fill="url(#white)" filter="url(#softSm)"/>
      <rect x="44.8" y="8.8" width="62.4" height="46.4" rx="23.2" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
    <text x="346" y="490" font-size="13" fill="#ffffff" fill-opacity="0.4">开启 · ON</text>

    <!-- 按下（液化） -->
    <g transform="translate(476,352) scale(1.5)">
      <rect width="112" height="64" rx="32" fill="url(#greenSm)" filter="url(#softSm)"/>
      <rect width="112" height="64" rx="32" fill="url(#trackHi)"/>
      <rect x="38" y="12" width="70" height="40" rx="20" fill="url(#pressFill)"/>
      <rect x="38" y="12" width="70" height="40" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.2"/>
      <rect x="42" y="14" width="62" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.24"/>
    </g>
    <text x="560" y="490" font-size="13" fill="#ffffff" fill-opacity="0.4">按下 · 液化</text>

    <!-- OFF -->
    <g transform="translate(690,352) scale(1.5)">
      <rect width="112" height="64" rx="32" fill="#ffffff" fill-opacity="0.05" filter="url(#softSm)"/>
      <rect x="0.7" y="0.7" width="110.6" height="62.6" rx="31.3" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.4"/>
      <rect width="112" height="64" rx="32" fill="url(#trackHi)"/>
      <rect x="4" y="8" width="64" height="48" rx="24" fill="url(#white)" filter="url(#softSm)"/>
      <rect x="4.8" y="8.8" width="62.4" height="46.4" rx="23.2" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
    <text x="774" y="490" font-size="13" fill="#ffffff" fill-opacity="0.4">关闭 · OFF</text>

  </g>
</svg>
